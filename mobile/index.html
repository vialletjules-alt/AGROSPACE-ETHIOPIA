<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AgroSpace · Mobile Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Jost,sans-serif;padding:20px}

.phone{width:390px;height:844px;background:#000;border-radius:54px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,0.6),0 0 0 2px #333,0 0 0 4px #555;position:relative;flex-shrink:0}

.phone-screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:#fff}
.phone-screen iframe{width:100%;height:100%;border:none;display:block}

.label{text-align:center;margin-top:24px;color:rgba(255,255,255,0.5);font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase}

@media(max-width:480px){body{padding:10px}.phone{width:100%;height:100vh;border-radius:0;padding:0;box-shadow:none}.phone-screen{border-radius:0}}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;align-items:center">
  <div class="phone">
    <div class="phone-screen">
      <iframe src="/preview-final.html" title="AgroSpace" loading="eager"></iframe>
    </div>
  </div>
  <div class="label">AgroSpace · Mobile Preview</div>
</div>
</body>
</html>
